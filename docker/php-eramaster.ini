; Data Import accepts Excel/CSV/JSON files; photos are sent as base64 -> allow generous bodies.
upload_max_filesize = 64M
post_max_size       = 80M
memory_limit        = 512M
max_execution_time  = 120
expose_php          = Off
display_errors      = Off
log_errors          = On
error_log           = /dev/stderr
date.timezone       = Africa/Nairobi
; session.save_path is set at boot by entrypoint.sh (it moves onto the persistent volume when one is mounted)
